<script>
/* лента лежит волной вдоль низа страницы — её тоже можно потянуть */
(function () {
  var host = document.getElementById('errTape');
  var hero = document.getElementById('top');
  if (!window.SEVEN || !SEVEN.Tape) return;
  var tape = new SEVEN.Tape(host, {
    area: hero,
    layout: function (W, H) {
      var w = W < 900 ? Math.min(40, Math.max(30, W * .086)) : Math.min(54, Math.max(40, W * .033));
      var pts = [], n = 60, y0 = H - Math.max(110, H * .17);
      for (var i = 0; i <= n; i++) {
        var t = i / n;
        pts.push([-w + t * (W + 2 * w) * .96, y0 + Math.sin(t * Math.PI * 2.2 + .6) * H * .045]);
      }
      return { pts: pts, w: w };
    },
  });
  var go = function () { tape.build(true); };
  (document.fonts && document.fonts.load ? document.fonts.load('600 10px Onest') : Promise.resolve()).then(go, go);
  var lastW = innerWidth;
  addEventListener('resize', function () {
    if (Math.abs(innerWidth - lastW) < 2) return;
    lastW = innerWidth;
    tape.build(false);
  });
})();
</script>
